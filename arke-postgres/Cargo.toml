[package]
name = "arke-postgres"
version = "0.19.0"
edition = "2024"
rust-version = "1.88"
description = "PostgreSQL adapter for the arke ECS — relational, typed-column persistence (source of truth)."
license = "MIT"
repository = "https://github.com/dalfiannur/arke"
readme = "README.md"
keywords = ["ecs", "postgres", "sqlx", "persistence", "orm"]
categories = ["database", "game-development"]
# Paket ramping: sumber + README + lisensi.
include = ["/src", "/examples", "/Cargo.toml", "/README.md", "/LICENSE-MIT"]

# Adapter: BOLEH punya dependensi (di luar STD-0003 yang mengikat core `arke`).
[dependencies]
arke = { version = "0.7.0", path = ".." }
arke-postgres-derive = { version = "0.10.0", path = "../arke-postgres-derive" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
# Untuk trait `ComponentCache` object-safe (dyn) yang async (RFC-0033).
async-trait = "0.1"
# Kolom `UUID`/`TIMESTAMPTZ` bertipe (fitur opsional; dibawa sebagai teks di
# batas driver, jadi tak butuh fitur `uuid`/`chrono` milik sqlx).
uuid = { version = "1", default-features = false, features = ["std"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }

[features]
uuid = ["dep:uuid"]
chrono = ["dep:chrono"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
