[package]
name = "arke-benchmarks"
version = "0.0.0"
edition = "2024"
publish = false

# Benchmark kompetitif (bukan bagian core arke). Memakai ECS pihak-ketiga
# untuk perbandingan; dijalankan manual (`cargo run --release`), di luar CI.
[dependencies]
arke = { path = ".." }
hecs = "0.11"
bevy_ecs = "0.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
