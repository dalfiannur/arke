name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Build (default)
        run: cargo build --workspace --verbose

      - name: Build (no default features)
        run: cargo build --no-default-features --verbose

      - name: Test
        run: cargo test --workspace --verbose

      # STD-0004: kode pengguna dapat memakai API di bawah forbid(unsafe_code).
      - name: No-unsafe example (STD-0004)
        run: cargo run --example no_unsafe

      # Contoh onboarding self-verifying: tiap contoh diakhiri assert!, jadi
      # menjalankannya = regresi-guard perilaku yang terdokumentasi untuk pengguna.
      - name: Onboarding examples
        run: |
          cargo run --example 01_hello_ecs
          cargo run --example 02_determinisme_paralel
          cargo run --example 03_simulasi

      # Regresi-guard performa (RN-0003): benchmark 0-dependensi dijalankan dengan
      # ceiling ns/op **longgar** (min beberapa pass). Gagal (exit≠0) hanya pada
      # regresi BESAR/algoritmik (mis. loop lockstep balik) — bukan fluktuasi
      # kecil di runner CI yang bervariasi. Menjaga jalur panas tak diam-diam lambat.
      - name: Benchmark regresi-guard (RN-0003)
        run: ARKE_BENCH_CHECK=1 cargo bench --bench storage_workloads

      # STD-0003: CORE `arke` standalone — tidak boleh ada dependensi PIHAK-KETIGA
      # (crates.io). Di-scope ke `-p arke`: hanya `arke` + `arke-derive` (first-party)
      # yang boleh. Crate adapter (mis. `arke-postgres`) SENGAJA di luar cek ini —
      # merekalah gerbang dependensi (RFC-0021).
      - name: Standalone core (STD-0003)
        run: |
          extra=$(cargo tree -p arke -e normal --prefix none | sort -u | grep -vE '^arke(-derive)? ' | grep -v '^$' || true)
          if [ -n "$extra" ]; then
            echo "Dependensi pihak-ketiga terdeteksi pada core arke (melanggar STD-0003):"
            echo "$extra"
            exit 1
          fi

  # Gerbang verifikasi undefined behavior (prasyarat paralelisme tingkat-sistem,
  # ADR-0006/RN-0001). Menjalankan test suite `arke` di bawah miri.
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: miri test (arke lib)
        run: cargo miri test -p arke --lib
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"

  # Uji integrasi adapter `arke-postgres` terhadap Postgres nyata (RFC-0021).
  # Tanpa job ini, uji `store` di-skip (DATABASE_URL tak diset).
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arke
          POSTGRES_PASSWORD: arke
          POSTGRES_DB: arke_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: PgStore integrasi (arke-postgres)
        run: cargo test -p arke-postgres
        env:
          DATABASE_URL: postgres://arke:arke@localhost:5432/arke_test
