name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Build (default)
        run: cargo build --workspace --verbose

      - name: Build (no default features)
        run: cargo build --no-default-features --verbose

      - name: Test
        run: cargo test --workspace --verbose

      # STD-0004: kode pengguna dapat memakai API di bawah forbid(unsafe_code).
      - name: No-unsafe example (STD-0004)
        run: cargo run --example no_unsafe

      # STD-0003: standalone — tidak boleh ada dependensi PIHAK-KETIGA (crates.io).
      # `arke` & `arke-derive` adalah crate first-party workspace; sisanya dilarang.
      - name: Standalone (STD-0003)
        run: |
          extra=$(cargo tree -e normal --prefix none | sort -u | grep -vE '^arke(-derive)? ' | grep -v '^$' || true)
          if [ -n "$extra" ]; then
            echo "Dependensi pihak-ketiga terdeteksi (melanggar STD-0003):"
            echo "$extra"
            exit 1
          fi
