[package]
name = "arke"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "ECS standalone, deterministik, berbasis archetype untuk Rust — jalur ergonomis adalah jalur cepat."
license = "MIT"
repository = "https://github.com/dalfiannur/rust-ecs"
keywords = ["ecs", "entity-component-system", "deterministic", "gamedev", "simulation"]
categories = ["data-structures", "game-development"]

[lib]
name = "arke"

# Standalone core: TIDAK ADA dependensi eksternal (STD-0003).
# Integrasi eksternal, bila ada nanti, hidup di crate/feature adapter terpisah.
[dependencies]

[dev-dependencies]

# Invarian "ergonomis = cepat" (ARCHITECTURE_BIBLE §2):
# `unsafe` ditolak secara default dan hanya diizinkan-ulang di modul `storage`
# dengan argumen keamanan. Kode PENGGUNA tak pernah butuh `unsafe` (STD-0004).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
