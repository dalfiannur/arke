[workspace]
members = ["arke-derive", "arke-postgres", "arke-postgres-derive"]
# Crate benchmark kompetitif memakai ECS pihak-ketiga (hecs/bevy_ecs) untuk
# perbandingan — di luar workspace inti & CI agar core tetap 0-dependensi.
exclude = ["benchmarks"]
resolver = "2"

[package]
name = "arke"
version = "0.5.1"
edition = "2024"
rust-version = "1.86"
description = "ECS standalone, deterministik, berbasis archetype untuk Rust — jalur ergonomis adalah jalur cepat."
license = "MIT"
repository = "https://github.com/dalfiannur/arke"
keywords = ["ecs", "archetype", "deterministic", "gamedev", "simulation"]
categories = ["data-structures", "game-development"]
# Paket ramping: hanya sumber + README + lisensi. Governance & docs hidup di repo.
include = ["/src", "/benches", "/Cargo.toml", "/README.md", "/LICENSE-MIT"]

[lib]
name = "arke"

# Harness benchmark 0-dependensi (RN-0002): `harness = false` → main() sendiri
# memakai `std::time::Instant` + `std::hint::black_box`, tanpa `criterion`.
# Set `ARKE_BENCH_QUICK=1` untuk mode cepat (smoke CI).
[[bench]]
name = "storage_workloads"
harness = false

# Standalone core: TIDAK ADA dependensi PIHAK-KETIGA (STD-0003).
# `arke-derive` adalah crate first-party di workspace ini, sendiri 0-dependensi
# crates.io (proc-macro tulis-tangan). Integrasi eksternal lain, bila ada nanti,
# hidup di crate/feature adapter terpisah.
[dependencies]
arke-derive = { version = "0.3.0", path = "arke-derive" }

[dev-dependencies]

# Invarian "ergonomis = cepat" (ARCHITECTURE_BIBLE §2):
# `unsafe` ditolak secara default dan hanya diizinkan-ulang di modul `storage`
# dengan argumen keamanan. Kode PENGGUNA tak pernah butuh `unsafe` (STD-0004).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
